# Test-only configuration; Home Assistant installs from manifest.json.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-config --strict-markers --cov=custom_components.noah_optimizer.pv_surplus --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
