# Growatt NOAH – prognosebasierte Leistungsregelung
# Datei: /config/packages/noah_optimizer.yaml
#
# Vor dem Neustart alle Platzhalter mit "dein_" bzw. "deine_" durch die
# tatsächlichen Entity-IDs ersetzen. Positive Netzleistung muss Netzbezug,
# negative Netzleistung Einspeisung bedeuten. Falls das bei deinem Zähler
# umgekehrt ist, den Schalter "NOAH Netzvorzeichen umkehren" aktivieren.
#
# Benötigte externe Entitäten:
# - sensor.dein_netzleistungssensor
# - sensor.dein_noah_solar_power
# - sensor.dein_noah_output_power
# - sensor.dein_noah_soc
# - sensor.dein_noah_charging_power
# - sensor.dein_noah_discharge_power
# - sensor.deine_forecast_solar_restprognose
# - number.dein_noah_system_output_power

input_boolean:
  noah_optimizer_enabled:
    name: NOAH Optimierer aktiv
    icon: mdi:robot

  noah_grid_sign_inverted:
    name: NOAH Netzvorzeichen umkehren
    icon: mdi:swap-vertical

input_select:
  noah_optimizer_mode:
    name: NOAH Betriebsart
    options:
      - Automatik
      - Eigenverbrauch
      - Ladepriorität
      - Manuell
    initial: Automatik
    icon: mdi:tune-variant

input_number:
  noah_battery_capacity_kwh:
    name: NOAH nutzbare Akkukapazität
    min: 0.5
    max: 16
    step: 0.001
    unit_of_measurement: kWh
    mode: box
    icon: mdi:battery

  noah_target_soc:
    name: NOAH Ziel-SOC bei Sonnenuntergang
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-check

  noah_min_soc:
    name: NOAH Mindest-SOC
    min: 0
    max: 30
    step: 1
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-alert

  noah_charge_efficiency:
    name: NOAH angenommener Ladewirkungsgrad
    min: 0.70
    max: 1.00
    step: 0.01
    mode: box
    icon: mdi:percent-circle

  noah_forecast_factor:
    name: NOAH Prognose-Sicherheitsfaktor
    min: 0.30
    max: 1.20
    step: 0.01
    mode: slider
    icon: mdi:weather-partly-cloudy

  noah_forecast_safety_kwh:
    name: NOAH zusätzliche Energiereserve
    min: 0
    max: 3
    step: 0.05
    unit_of_measurement: kWh
    mode: box
    icon: mdi:shield-battery

  noah_release_margin_kwh:
    name: NOAH Freigabemarge
    min: 0.05
    max: 3
    step: 0.05
    unit_of_measurement: kWh
    mode: box
    icon: mdi:chart-bell-curve-cumulative

  noah_expected_day_load_w:
    name: NOAH erwartete mittlere Hauslast bis Sonnenuntergang
    min: 0
    max: 1500
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:home-lightning-bolt

  noah_grid_reserve_w:
    name: NOAH gewünschter Rest-Netzbezug
    min: 0
    max: 250
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:transmission-tower-import

  noah_max_output_w:
    name: NOAH maximale Ausgangsleistung
    min: 0
    max: 800
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:flash

  noah_night_max_output_w:
    name: NOAH maximale Ausgangsleistung nachts
    min: 0
    max: 800
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:weather-night

  noah_manual_output_w:
    name: NOAH manuelle Ausgangsleistung
    min: 0
    max: 800
    step: 10
    unit_of_measurement: W
    mode: slider
    icon: mdi:knob

  noah_command_step_w:
    name: NOAH Stellgrößenraster
    min: 10
    max: 200
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:stairs

  noah_command_deadband_w:
    name: NOAH Schalt-Hysterese
    min: 10
    max: 250
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:arrow-expand-horizontal

  noah_last_target_w:
    name: NOAH zuletzt gesendeter Sollwert
    min: 0
    max: 800
    step: 1
    initial: 0
    unit_of_measurement: W
    mode: box
    icon: mdi:send-clock

input_datetime:
  noah_last_command:
    name: NOAH letzter Stellbefehl
    has_date: true
    has_time: true
    icon: mdi:clock-check

template:
  - sensor:
      # ---------- Adapter: hier die vorhandenen Entity-IDs einsetzen ----------
      - name: NOAH Opt Netzleistung
        unique_id: noah_opt_grid_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.dein_netzleistungssensor') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set raw = states('sensor.dein_netzleistungssensor') | float(0) %}
          {{ (raw * (-1 if is_state('input_boolean.noah_grid_sign_inverted', 'on') else 1)) | round(0) }}

      - name: NOAH Opt PV-Leistung
        unique_id: noah_opt_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.dein_noah_solar_power') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.dein_noah_solar_power') | float(0) | round(0) }}"

      - name: NOAH Opt Ausgangsleistung
        unique_id: noah_opt_output_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.dein_noah_output_power') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.dein_noah_output_power') | float(0) | round(0) }}"

      - name: NOAH Opt SOC
        unique_id: noah_opt_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: >
          {{ states('sensor.dein_noah_soc') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.dein_noah_soc') | float(0) | round(1) }}"

      - name: NOAH Opt Ladeleistung
        unique_id: noah_opt_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.dein_noah_charging_power') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.dein_noah_charging_power') | float(0) | round(0) }}"

      - name: NOAH Opt Entladeleistung
        unique_id: noah_opt_discharge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.dein_noah_discharge_power') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.dein_noah_discharge_power') | float(0) | round(0) }}"

      - name: NOAH Opt Restprognose heute
        unique_id: noah_opt_forecast_remaining
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: >
          {{ states('sensor.deine_forecast_solar_restprognose') not in
            ['unknown', 'unavailable', 'none', ''] }}
        state: "{{ states('sensor.deine_forecast_solar_restprognose') | float(0) | round(3) }}"

      # ---------- Aufbereitete Momentanwerte ----------
      - name: NOAH Opt Netzbezug
        unique_id: noah_opt_grid_import
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.noah_opt_netzleistung') }}"
        state: >
          {{ [states('sensor.noah_opt_netzleistung') | float(0), 0] | max | round(0) }}

      - name: NOAH Opt Netzeinspeisung
        unique_id: noah_opt_grid_export
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.noah_opt_netzleistung') }}"
        state: >
          {{ [-(states('sensor.noah_opt_netzleistung') | float(0)), 0] | max | round(0) }}

      - name: NOAH Opt Hauslast
        unique_id: noah_opt_home_load
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.noah_opt_netzleistung')
            and has_value('sensor.noah_opt_ausgangsleistung') }}
        state: >
          {% set grid = states('sensor.noah_opt_netzleistung') | float(0) %}
          {% set output = states('sensor.noah_opt_ausgangsleistung') | float(0) %}
          {{ [grid + output, 0] | max | round(0) }}

      - name: NOAH Opt Batterieleistung
        unique_id: noah_opt_battery_net_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.noah_opt_ladeleistung')
            and has_value('sensor.noah_opt_entladeleistung') }}
        state: >
          {{ ((states('sensor.noah_opt_entladeleistung') | float(0))
              - (states('sensor.noah_opt_ladeleistung') | float(0))) | round(0) }}

      # ---------- Prognose und Ladeplanung ----------
      - name: NOAH Opt Stunden bis Sonnenuntergang
        unique_id: noah_opt_hours_to_sunset
        unit_of_measurement: h
        state_class: measurement
        state: >
          {% if is_state('sun.sun', 'above_horizon') %}
            {% set sunset = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
            {{ [((sunset - as_timestamp(now())) / 3600), 0] | max | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: NOAH Opt verfügbare Akkuenergie
        unique_id: noah_opt_energy_available
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: "{{ has_value('sensor.noah_opt_soc') }}"
        state: >
          {% set cap = states('input_number.noah_battery_capacity_kwh') | float(0) %}
          {% set soc = states('sensor.noah_opt_soc') | float(0) %}
          {% set min_soc = states('input_number.noah_min_soc') | float(0) %}
          {{ (cap * ([soc - min_soc, 0] | max) / 100) | round(3) }}

      - name: NOAH Opt Ladebedarf
        unique_id: noah_opt_charge_need
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: "{{ has_value('sensor.noah_opt_soc') }}"
        state: >
          {% set cap = states('input_number.noah_battery_capacity_kwh') | float(0) %}
          {% set target = states('input_number.noah_target_soc') | float(0) %}
          {% set soc = states('sensor.noah_opt_soc') | float(0) %}
          {% set eff = states('input_number.noah_charge_efficiency') | float(0.9) %}
          {% set deficit = [target - soc, 0] | max %}
          {{ (cap * deficit / 100 / ([eff, 0.1] | max)) | round(3) }}

      - name: NOAH Opt wirksame Restprognose
        unique_id: noah_opt_effective_forecast
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >
          {% set forecast = states('sensor.noah_opt_restprognose_heute') | float(0) %}
          {% set factor = states('input_number.noah_forecast_factor') | float(0.8) %}
          {{ (forecast * factor) | round(3) }}

      - name: NOAH Opt erwarteter Hausenergiebedarf
        unique_id: noah_opt_expected_load_energy
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >
          {% set hours = states('sensor.noah_opt_stunden_bis_sonnenuntergang') | float(0) %}
          {% set load = states('input_number.noah_expected_day_load_w') | float(0) %}
          {{ (hours * load / 1000) | round(3) }}

      - name: NOAH Opt Prognosemarge
        unique_id: noah_opt_forecast_margin
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >
          {% set forecast = states('sensor.noah_opt_wirksame_restprognose') | float(0) %}
          {% set need = states('sensor.noah_opt_ladebedarf') | float(0) %}
          {% set load = states('sensor.noah_opt_erwarteter_hausenergiebedarf') | float(0) %}
          {% set reserve = states('input_number.noah_forecast_safety_kwh') | float(0) %}
          {{ (forecast - need - load - reserve) | round(3) }}

      - name: NOAH Opt Prognosedeckung
        unique_id: noah_opt_forecast_coverage
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set forecast = states('sensor.noah_opt_wirksame_restprognose') | float(0) %}
          {% set need = states('sensor.noah_opt_ladebedarf') | float(0) %}
          {% set load = states('sensor.noah_opt_erwarteter_hausenergiebedarf') | float(0) %}
          {% set reserve = states('input_number.noah_forecast_safety_kwh') | float(0) %}
          {% set required = need + load + reserve %}
          {{ (100 if required <= 0 else (forecast / required * 100)) | round(0) }}

      - name: NOAH Opt erforderliche mittlere Ladeleistung
        unique_id: noah_opt_required_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set need = states('sensor.noah_opt_ladebedarf') | float(0) %}
          {% set hours = states('sensor.noah_opt_stunden_bis_sonnenuntergang') | float(0) %}
          {{ (0 if hours <= 0 else need * 1000 / hours) | round(0) }}

      - name: NOAH Opt Minuten bis Ziel-SOC
        unique_id: noah_opt_minutes_to_target
        unit_of_measurement: min
        state_class: measurement
        state: >
          {% set need = states('sensor.noah_opt_ladebedarf') | float(0) %}
          {% set charge = states('sensor.noah_opt_ladeleistung') | float(0) %}
          {{ (0 if need <= 0 else (9999 if charge < 10 else need * 1000 / charge * 60)) | round(0) }}

      # ---------- Regler-Zwischenwerte ----------
      - name: NOAH Opt Eigenverbrauch-Soll
        unique_id: noah_opt_self_consumption_target
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set output = states('sensor.noah_opt_ausgangsleistung') | float(0) %}
          {% set grid_now = states('sensor.noah_opt_netzleistung') | float(0) %}
          {% set grid_avg = states('sensor.noah_opt_netzleistung_5_min') | float(0) %}
          {% set soc = states('sensor.noah_opt_soc') | float(0) %}
          {% set target_soc = states('input_number.noah_target_soc') | float(95) %}
          {% set reserve = states('input_number.noah_grid_reserve_w') | float(50) %}
          {% set max_output = states('input_number.noah_max_output_w') | float(800) %}

          {# Bei Einspeisung und nicht vollem Akku sofort reagieren #}
          {% if soc < target_soc and grid_now < 0 %}
            {% set raw = output + grid_now - reserve %}
          {% else %}
            {% set raw = output + grid_avg - reserve %}
          {% endif %}

          {{ [[raw, 0] | max, max_output] | min | round(0) }}

      - name: NOAH Opt Ladepriorität-Soll
        unique_id: noah_opt_charge_priority_target
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set pv = states('sensor.noah_opt_pv_leistung') | float(0) %}
          {% set required_charge = states('sensor.noah_opt_erforderliche_mittlere_ladeleistung') | float(0) %}
          {% set self_target = states('sensor.noah_opt_eigenverbrauch_soll') | float(0) %}
          {% set raw = [pv - required_charge, 0] | max %}
          {{ [raw, self_target] | min | round(0) }}

      - name: NOAH Opt Reglermodus
        unique_id: noah_opt_controller_mode
        icon: mdi:state-machine
        state: >
          {% set selected = states('input_select.noah_optimizer_mode') %}
          {% set soc = states('sensor.noah_opt_soc') | float(0) %}
          {% set min_soc = states('input_number.noah_min_soc') | float(0) %}
          {% set target_soc = states('input_number.noah_target_soc') | float(0) %}
          {% set margin = states('sensor.noah_opt_prognosemarge') | float(0) %}
          {% set release = states('input_number.noah_release_margin_kwh') | float(0.5) %}
          {% set pv = states('sensor.noah_opt_pv_leistung') | float(0) %}
          {% set elevation = state_attr('sun.sun', 'elevation') | float(90) %}
          {% set night =
            is_state('sun.sun', 'below_horizon')
            or (elevation < 3 and pv < 20)
          %}
          {% if not is_state('input_boolean.noah_optimizer_enabled', 'on') %}
            Aus
          {% elif selected != 'Automatik' %}
            {{ selected }}
          {% elif soc <= min_soc %}
            Mindest-SOC
          {% elif night %}
            Nachtbetrieb
          {% elif soc >= target_soc %}
            Ziel-SOC erreicht
          {% elif not has_value('sensor.noah_opt_restprognose_heute') %}
            Konservativ ohne Prognose
          {% elif margin <= 0 %}
            Ladepriorität
          {% elif margin >= release %}
            Eigenverbrauch
          {% else %}
            Gleitende Reserve
          {% endif %}

      - name: NOAH Opt Ausgangssollwert
        unique_id: noah_opt_output_target
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set selected = states('input_select.noah_optimizer_mode') %}
          {% set soc = states('sensor.noah_opt_soc') | float(0) %}
          {% set min_soc = states('input_number.noah_min_soc') | float(0) %}
          {% set target_soc = states('input_number.noah_target_soc') | float(0) %}
          {% set self_target = states('sensor.noah_opt_eigenverbrauch_soll') | float(0) %}
          {% set charge_target = states('sensor.noah_opt_ladeprioritat_soll') | float(0) %}
          {% set max_output = states('input_number.noah_max_output_w') | float(800) %}
          {% set night_max = states('input_number.noah_night_max_output_w') | float(400) %}
          {% set manual = states('input_number.noah_manual_output_w') | float(0) %}
          {% set margin = states('sensor.noah_opt_prognosemarge') | float(-99) %}
          {% set release = states('input_number.noah_release_margin_kwh') | float(0.5) %}
          {% set step = states('input_number.noah_command_step_w') | float(50) %}
          {% set pv = states('sensor.noah_opt_pv_leistung') | float(0) %}
          {% set elevation = state_attr('sun.sun', 'elevation') | float(90) %}
          {% set night =
            is_state('sun.sun', 'below_horizon')
            or (elevation < 3 and pv < 20)
          %}
          {% if selected == 'Manuell' %}
            {% set raw = manual %}
          {% elif selected == 'Eigenverbrauch' %}
            {% set raw = self_target %}
          {% elif selected == 'Ladepriorität' %}
            {% set raw = charge_target %}
          {% elif soc <= min_soc %}
            {% set raw = 0 %}
          {% elif night %}
            {% set raw = [self_target, night_max] | min %}
          {% elif soc >= target_soc %}
            {% set raw = self_target %}
          {% elif not has_value('sensor.noah_opt_restprognose_heute') %}
            {% set raw = charge_target %}
          {% elif margin <= 0 %}
            {% set raw = charge_target %}
          {% elif margin >= release %}
            {% set raw = self_target %}
          {% else %}
            {% set blend = [[margin / ([release, 0.05] | max), 0] | max, 1] | min %}
            {% set raw = charge_target + blend * (self_target - charge_target) %}
          {% endif %}
          {% set limited = [[raw, 0] | max, max_output] | min %}
          {{ ((limited / step) | round(0) * step) | round(0) }}

      - name: NOAH Opt Datenstatus
        unique_id: noah_opt_data_status
        icon: mdi:database-check
        state: >
          {% set critical =
            has_value('sensor.noah_opt_netzleistung')
            and has_value('sensor.noah_opt_pv_leistung')
            and has_value('sensor.noah_opt_ausgangsleistung')
            and has_value('sensor.noah_opt_soc') %}
          {% set actuator = states('number.dein_noah_system_output_power') not in
            ['unknown', 'unavailable', 'none', ''] %}
          {% set forecast = has_value('sensor.noah_opt_restprognose_heute') %}
          {% if not critical %}
            Messwerte fehlen
          {% elif not actuator %}
            Stellgröße fehlt
          {% elif not forecast %}
            Prognose fehlt – Ladepriorität
          {% else %}
            OK
          {% endif %}

  - binary_sensor:
      - name: NOAH Opt kritische Daten OK
        unique_id: noah_opt_critical_data_ok
        device_class: connectivity
        state: >
          {{ has_value('sensor.noah_opt_netzleistung')
            and has_value('sensor.noah_opt_pv_leistung')
            and has_value('sensor.noah_opt_ausgangsleistung')
            and has_value('sensor.noah_opt_soc') }}

      - name: NOAH Opt Prognose verfügbar
        unique_id: noah_opt_forecast_ok
        device_class: connectivity
        state: "{{ has_value('sensor.noah_opt_restprognose_heute') }}"

sensor:
  - platform: filter
    name: NOAH Opt Netzleistung 5 min
    unique_id: noah_opt_grid_power_5m
    entity_id: sensor.noah_opt_netzleistung
    filters:
      - filter: time_simple_moving_average
        window_size: "00:05"
        precision: 0

automation:
  - id: noah_optimizer_control
    alias: NOAH Optimierer – Ausgangsleistung regeln
    description: Setzt höchstens alle fünf Minuten einen gerasterten Sollwert.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.noah_optimizer_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.noah_opt_kritische_daten_ok
        state: "on"
      - condition: template
        value_template: >
          {{ states('number.dein_noah_system_output_power') not in
            ['unknown', 'unavailable', 'none', ''] }}
    actions:
      - variables:
          target: "{{ states('sensor.noah_opt_ausgangssollwert') | int(0) }}"
          last_target: "{{ states('input_number.noah_last_target_w') | int(0) }}"
          actual_setpoint: "{{ states('number.dein_noah_system_output_power') | int(0) }}"
          deadband: "{{ states('input_number.noah_command_deadband_w') | int(50) }}"
          minutes_since_command: >
            {% set last = states('input_datetime.noah_last_command') %}
            {% if last in ['unknown', 'unavailable', 'none', ''] %}
              9999
            {% else %}
              {{ ((as_timestamp(now()) - as_timestamp(last, 0)) / 60) | round(0) }}
            {% endif %}
          change_required: "{{ (target - last_target) | abs >= deadband }}"
          retry_required: >
            {{ minutes_since_command | float(9999) >= 20
              and (target - actual_setpoint) | abs >= deadband }}
      - condition: template
        value_template: "{{ change_required or retry_required }}"
      - action: number.set_value
        target:
          entity_id: number.dein_noah_system_output_power
        data:
          value: "{{ target }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.noah_last_target_w
        data:
          value: "{{ target }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.noah_last_command
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: noah_optimizer_failsafe
    alias: NOAH Optimierer – Datenausfall
    description: Versucht bei längerem Ausfall, die Ausgangsleistung auf 0 W zu setzen.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.noah_opt_kritische_daten_ok
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.noah_optimizer_enabled
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('number.dein_noah_system_output_power') not in
                    ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.dein_noah_system_output_power
                data:
                  value: 0
              - action: input_number.set_value
                target:
                  entity_id: input_number.noah_last_target_w
                data:
                  value: 0
      - action: persistent_notification.create
        data:
          notification_id: noah_optimizer_failsafe
          title: NOAH-Optimierer gestoppt
          message: >
            Kritische Messwerte fehlen seit mindestens zehn Minuten.
            Die Regelung wurde nicht weitergeführt; soweit erreichbar,
            wurde die NOAH-Ausgangsleistung auf 0 W gesetzt.

  - id: noah_optimizer_recovered
    alias: NOAH Optimierer – Daten wieder verfügbar
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.noah_opt_kritische_daten_ok
        to: "on"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: noah_optimizer_failsafe
